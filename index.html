<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>j-hasap</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/receipt-designer.css"></head>
<body><aside><a class="brand" href="/">◈ <span>j-hasap</span></a><div class="aside-label"><span data-i18n="WORKSPACE">WORKSPACE</span></div><nav><button data-view="checkout" class="active">▦ <span><span data-i18n="Checkout">Checkout</span></span></button><button data-view="products">▤ <span><span data-i18n="Products">Products</span></span></button><button data-view="sales">↗ <span><span data-i18n="Sales history">Sales history</span></span></button><button data-view="statistics">◷ <span><span data-i18n="Statistics">Statistics</span></span></button><button data-view="designer">☷ <span data-i18n="Receipt designer">Receipt designer</span></button></nav><label class="language-control">English / Türkmençe / Русский<select id="language" aria-label="English / Türkmençe / Русский"><option value="en">English</option><option value="tk">Türkmençe</option><option value="ru">Русский</option></select></label></aside>
<main><header><div><div class="eyebrow"><span data-i18n="YOUR EVERYDAY, SIMPLIFIED">YOUR EVERYDAY, SIMPLIFIED</span></div><h1 id="page-title"><span data-i18n="Checkout">Checkout</span></h1><p id="page-subtitle"><span data-i18n="Scan a product. Make a sale. Keep things moving.">Scan a product. Make a sale. Keep things moving.</span></p></div><div class="header-meta"><span id="today"></span><span class="pill">● <span data-i18n="Local workspace">Local workspace</span></span></div></header><div id="view"></div></main>
<dialog id="product-dialog"><form id="product-form"><div class="dialog-heading"><h2 id="product-title"><span data-i18n="Add product">Add product</span></h2><button type="button" class="icon" onclick="this.closest('dialog').close()" data-i18n-label="Close" aria-label="Close">×</button></div><input type="hidden" name="id"><input type="hidden" name="image"><div class="product-image-editor"><img id="product-image-preview" src="/product-images/default.svg" data-i18n-label="Product picture" alt="Product picture"><div><label><span data-i18n="Product picture">Product picture</span><input id="product-image-file" type="file" accept="image/png,image/jpeg,image/webp"><small data-i18n="PNG, JPEG or WebP · Up to 400 KB">PNG, JPEG or WebP · Up to 400 KB</small></label><button type="button" class="text-button" id="remove-product-image"><span data-i18n="Remove picture">Remove picture</span></button></div></div><label><span data-i18n="Product name">Product name</span><input name="name" required maxlength="120" data-i18n-placeholder="e.g. House blend coffee" placeholder="e.g. House blend coffee"></label><label><span data-i18n="Barcode">Barcode</span><div class="input-action"><input name="barcode" required maxlength="32" data-i18n-placeholder="Scan or enter a barcode" placeholder="Scan or enter a barcode"><button type="button" id="generate-barcode"><span data-i18n="Generate">Generate</span></button></div><small><span data-i18n="Letters, numbers and Code 39 symbols. Generated labels use Code 39.">Letters, numbers and Code 39 symbols. Generated labels use Code 39.</span></small></label><label><span data-i18n="Price (TMT)">Price (TMT)</span><input name="price" type="number" min="0" max="1000000" step="0.01" required placeholder="0.00"></label><label><span data-i18n="Available quantity">Available quantity</span><input name="stock" type="number" min="0" max="1000000" step="1" value="0" required></label><p id="product-error" class="error"></p><button class="primary full"><span data-i18n="Save product">Save product</span></button></form></dialog>
<dialog id="receipt-dialog"><div class="dialog-heading"><h2><span data-i18n="Sale completed">Sale completed</span></h2><button class="icon" onclick="this.closest('dialog').close()" data-i18n-label="Close" aria-label="Close">×</button></div><div id="receipt-preview"></div><button class="primary full" id="print-receipt"><span data-i18n="Print receipt">Print receipt</span></button></dialog>
<dialog id="product-history-dialog"><div class="dialog-heading"><h2 data-i18n="Product history">Product history</h2><button class="icon" onclick="this.closest('dialog').close()" data-i18n-label="Close" aria-label="Close">×</button></div><div id="product-history-content"></div></dialog><dialog id="print-options-dialog"><div class="dialog-heading"><h2 data-i18n="Print options">Print options</h2><button class="icon" onclick="this.closest('dialog').close()" data-i18n-label="Close" aria-label="Close">×</button></div><label><span data-i18n="Printing method">Printing method</span><select id="job-printer-method"><option value="browser" data-i18n="Browser / installed printer">Browser / installed printer</option><option value="bluetooth">BT-802 Bluetooth</option></select></label><p id="job-printer-status" class="job-printer-status" role="status" aria-live="polite"></p><button class="secondary" id="job-printer-check" data-i18n="Check connection">Check connection</button><button class="primary full" id="job-print-confirm" data-i18n="Print">Print</button></dialog><div id="toast" role="status"></div><div id="print-area"></div><script src="/i18n.js"></script><script src="/vendor-qrcode.js"></script><script src="/vendor-html2canvas.js"></script><script src="/bluetooth-print.js"></script><script src="/receipt-designer.js"></script><script src="/app.js"></script></body></html>
